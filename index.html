<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Alex Drost — drost.us">
  <meta property="og:description" content="Keynote speaker and strategy consultant serving middle-market professional service firms.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://drost.us">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0A0A0F;
      --orange: #FF7B00;
      --orange-muted: rgba(255, 123, 0, 0.15);
      --text-primary: #F8F8F2;
      --text-secondary: #A0A0B0;
      --text-muted: #626274;
      --border: #2A2A35;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 123, 0, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(255, 123, 0, 0.035) 0%, transparent 45%);
      pointer-events: none;
      z-index: -1;
    }

    a { text-decoration: none; color: inherit; }

    .eyebrow {
      display: inline-block;
      color: var(--orange);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.8rem;
      padding: 0.6rem 1.8rem;
      border: 1px solid var(--orange-muted);
      background: rgba(255, 123, 0, 0.03);
      border-radius: 100px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeInDown 0.8s forwards;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(3rem, 13vw, 7rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeInUp 0.8s 0.2s forwards;
    }

    h1 span {
      background: linear-gradient(to bottom right, #fff, #9a9aac);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--orange);
    }

    .subhead {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 540px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeInUp 0.8s 0.4s forwards;
    }

    .linkedin-link {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      transition: var(--transition);
      margin-top: 2.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s 0.6s forwards;
    }

    .linkedin-link:hover {
      border-color: var(--orange);
      color: var(--orange);
      transform: translateY(-2px);
    }

    .footer-note {
      position: fixed;
      bottom: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeInUp 0.8s 0.8s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <p class="eyebrow">drost.us</p>
  <h1><span>Alex</span> <em>Drost</em></h1>

  <a href="https://www.linkedin.com/in/adrost/" target="_blank" rel="noopener" class="linkedin-link">

    Connect with Alex Drost on LinkedIn
  </a>

  <div class="footer-note">
    &copy; <script>document.write(new Date().getFullYear())</script> Alex Drost &middot; Detroit, Michigan
  </div>

</body>
</html>
